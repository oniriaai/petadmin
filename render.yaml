# Render Blueprint for the hosted DEMO. Not production: see docker-compose.prod.yml for that.
#
# Two free services: the API as a Docker web service, and the frontend as a static site. The
# database is external (Neon free tier), because Render's own free Postgres is deleted 30 days
# after it is created.
#
# This instance seeds the demo tenants, whose passwords get handed around, and rebuilds the
# main one every day. Never point its DATABASE_URL at a database that holds a customer's data.
#
# Step by step, including the values entered by hand: docs/demo-hosting.md

services:
  - type: web
    name: argos-demo-api
    runtime: docker
    plan: free
    region: virginia
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Deploys are started by .github/workflows/deploy-demo.yml once CI has passed on main, and
    # verified afterwards. Left on, Render would also build every push on its own, ungated.
    branch: main
    autoDeployTrigger: "off"
    # The free plan has no pre-deploy step, so migrations and the seed run before the server on
    # every start, including each wake from idle. Both are no-ops when there is nothing to do.
    # The sequence lives in an npm script (backend/package.json) rather than here: Render does
    # not parse a quoted `sh -c "a && b"` the way a shell does, and passed the whole string to
    # sh as the name of one command.
    # The script pins the Prisma CLI to the version in package-lock.json: it is a dev dependency,
    # absent from the image, and an unpinned `npx prisma` would fetch a newer major.
    dockerCommand: npm run start:demo
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      # Render routes to the port the process listens on; the backend reads BACKEND_PORT.
      - key: BACKEND_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SEED_DEMO_RESET
        value: daily
      # No cron on the free plan. The generator runs once at each start instead, which for a
      # service that sleeps after 15 idle minutes is several times a day. The reminders pass
      # starts with it, and only sends for a unit where someone turned automatic sending on.
      - key: RUN_SCHEDULER_IN_PROCESS
        value: "true"
      # Reminder emails, through Resend (docs/recordatorios.md). The demo sends for real, but
      # its seeded tutors all have Resend's test inbox as their address. Use an API key made
      # for the demo alone, so it can be revoked without touching production. WhatsApp is
      # deliberately absent: the seeded phone numbers are invented and may be someone's.
      # Port 2465, not 465: free web services cannot reach SMTP ports 25, 465 and 587, and
      # Resend also listens on 2465 (implicit TLS) and 2587 (STARTTLS).
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # The static site's URL, the same value as CORS_ORIGINS: where the email finds the logo.
      - key: PUBLIC_SITE_URL
        sync: false
      # The demo's passwords get shared around. This bounds what can be sent in a day.
      - key: REMINDERS_DAILY_CAP
        value: "50"
      - key: JWT_SECRET
        generateValue: true
      - key: SUPERADMIN_PASSWORD
        generateValue: true
      # The demo logins. Their development passwords are in this public repository, so here
      # each gets one Render generates, and the seed refuses to run without them. Read them in
      # the service's Environment tab; the seed rewrites an account whose value changes.
      - key: DEMO_PASSWORD_ADMIN_GLOBAL
        generateValue: true
      - key: DEMO_PASSWORD_GUARDERIA_ADMIN
        generateValue: true
      - key: DEMO_PASSWORD_PELUQUERIA_ADMIN
        generateValue: true
      - key: DEMO_PASSWORD_VET_ADMIN
        generateValue: true
      - key: DEMO_PASSWORD_DEMO_ADMIN
        generateValue: true
      # Neon's DIRECT connection string (the host without "-pooler"): `migrate deploy` needs a
      # session, which the pooled endpoint does not give it.
      - key: DATABASE_URL
        sync: false
      # The static site's URL as Render assigned it (no trailing slash). Not necessarily
      # https://argos-demo.onrender.com: when a name is taken Render appends a suffix.
      - key: CORS_ORIGINS
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false

  - type: web
    name: argos-demo
    runtime: static
    rootDir: frontend
    branch: main
    autoDeployTrigger: "off"
    # The build also writes dist/version.txt (frontend/vite.config.ts), which is how the deploy
    # workflow knows which commit the site is serving.
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # A single-page app: unknown paths are routes, not missing files.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # The application is not search material, whatever the page itself says. The workspace's
    # own routes are covered by the tag the application adds once it runs (src/App.tsx).
    headers:
      # Hashed by the build, so a file under /assets/ never changes.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The same browser-side hardening the production nginx image sends (frontend/Dockerfile).
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'
      - path: /login
        name: X-Robots-Tag
        value: noindex
      - path: /platform/*
        name: X-Robots-Tag
        value: noindex
    envVars:
      # Baked into the bundle at build time: the API's URL followed by /api/v1, e.g.
      # https://argos-demo-api.onrender.com/api/v1. Left empty or without the suffix, every
      # request the page makes 404s; redeploy after setting it.
      - key: VITE_API_URL
        sync: false
      # The site's own URL, no trailing slash. Leave it empty: without it the build disallows
      # every crawler (frontend/vite.config.ts), which is what a demo whose passwords get
      # handed around wants. Setting it publishes a sitemap and lets the landing be indexed.
      - key: VITE_SITE_URL
        sync: false
