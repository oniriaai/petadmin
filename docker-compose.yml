services:
  postgres:
    image: postgres:16-alpine
    container_name: pethijos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: node:20-alpine
    container_name: pethijos-backend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
      VAT_PERCENT: ${VAT_PERCENT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres

  frontend:
    image: node:20-alpine
    container_name: pethijos-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT}"
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT}/api/v1
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  postgres_data:
