services:
  postgres:
    image: postgres:16-alpine
    container_name: pethijos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pethijos-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pethijos.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    image: node:20-alpine
    container_name: pethijos-backend
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache openssl &&
        npm install &&
        npx prisma generate &&
        npx prisma db push --accept-data-loss &&
        npx tsx prisma/seed.ts;
        npm run dev
      "
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
      VAT_PERCENT: ${VAT_PERCENT}
      NODE_ENV: development
      PRISMA_QUERY_ENGINE_LIBRARY: /app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: pethijos-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT}"
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT}/api/v1
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  postgres_data:
